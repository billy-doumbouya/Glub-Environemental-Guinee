<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15803D" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" />

    <title>ONG C.E.G &mdash; Club Environnemental de Guinee</title>
    <meta name="description" content="ONG Club Environnemental de Guinee: preservation de l'environnement, developpement durable et amelioration des conditions de vie des populations guineennes depuis 2016." />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ONG C.E.G &mdash; Club Environnemental de Guinee" />
    <meta property="og:description" content="ONG Club Environnemental de Guinee : preservation de l'environnement, developpement durable et amelioration des conditions de vie des populations guineennes depuis 2016." />
    <meta property="og:locale" content="fr_GN" />
    <meta name="geo.region" content="GN" />
    <meta name="geo.placename" content="Forecariah, Guinee" />
    <meta name="language" content="fr" />

    <style>
      #app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f0fdf4;
        gap: 16px;
      }
      #app-loading .logo {
        font-weight: 800;
        color: #15803d;
        font-size: 22px;
        letter-spacing: -0.5px;
      }
      #app-loading .sub {
        font-size: 12px;
        color: #6b7280;
        margin: -8px 0 0;
      }
      #app-loading .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #dcfce7;
        border-top-color: #16a34a;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #app-loading .msg {
        color: #9ca3af;
        font-size: 13px;
        margin: 0;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Affiché tant que React n'a pas monté -->
      <div id="app-loading">
        <div class="logo">ONG C.E.G</div>
        <p class="sub">Club Environnemental de Guinée</p>
        <div class="spinner"></div>
        <p class="msg">Chargement en cours…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <noscript>
      <div style="text-align:center;padding:60px 20px;font-family:sans-serif;color:#374151">
        <h2 style="color:#15803d">ONG C.E.G</h2>
        <p>Veuillez activer JavaScript pour accéder au site.</p>
      </div>
    </noscript>
  </body>
</html>
